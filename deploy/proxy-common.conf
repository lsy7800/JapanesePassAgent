# 反代后端的公共 header，供各 location 用 include 引入。
#
# 为什么必须用 include 而不是写在 http/server 层：nginx 的 proxy_set_header
# 继承是「整组覆盖」——只要某个 location 自己写了任意一条 proxy_set_header，
# 上层那一组就全部不继承。SSE 的 location 需要 `Connection ""`，
# 一写就会把 X-Forwarded-Proto / X-Forwarded-For 悄悄丢掉，而后端
# uvicorn 带 --proxy-headers 正是靠这两个头识别真实来源和协议。
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# 走 upstream keepalive 需要清空 Connection（不能是 close/upgrade）
proxy_set_header Connection        "";
