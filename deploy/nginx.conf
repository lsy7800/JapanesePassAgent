# 两个前端按「端口」分流（当前配置，适用于还没有域名、直接用 IP 访问）：
#   http://<IP>/       → 学生端（student/dist）
#   http://<IP>:8080/  → 后台管理（frontend/dist）
#
# 为什么用端口而不是路径前缀（/admin/）：两个 SPA 的 vite base 和 vue-router base
# 都是默认 '/'，用端口零改动；换成路径前缀就得同时改 frontend 的 vite.config.js
# base 和 createWebHistory('/admin/')，还要重新 build。
#
# server_name _ 是通配，IP 访问才能命中。注意：靠 server_name 区分子域名的写法
# 在 IP 访问下会全部落到第一个 server 块，后台界面将无法访问——这是刻意改掉的。
#
# 拿到域名后要切回子域名方案：把两个 server 块的 listen 都改成 80，
# server_name 分别填 www.<域名> 和 admin.<域名>，并同步 docker-compose.prod.yml
# 的端口映射与后端 .env 的 ALLOWED_ORIGINS。
#
# 两个前端的 API 客户端都硬编码相对路径 baseURL: '/api/v1'（student/src/api/http.js、
# frontend/src/api/http.js），Vite 的 proxy 只在 dev 生效，所以生产必须由这里把
# /api 转给后端，否则前端所有请求 404。两个 server 块都要有 /api 的反代。
#
# 反代 header 统一放在 proxy-common.conf 里 include —— 见那个文件开头关于
# nginx proxy_set_header 整组覆盖的说明，别把它们挪回 server 层。

upstream backend {
    server backend:8000;
    keepalive 32;
}

# 静态资源缓存：Vite 产物带内容 hash，可以长缓存
map $sent_http_content_type $static_cache {
    default                 "no-cache";
    ~image/                 "public, max-age=2592000, immutable";
    ~font/                  "public, max-age=2592000, immutable";
    ~application/javascript "public, max-age=2592000, immutable";
    ~text/css               "public, max-age=2592000, immutable";
}

# ---------------- 学生端（http://<IP>/）----------------
server {
    listen 80 default_server;
    # _ 是通配：用 IP 访问时 Host 头是 IP，匹配不上具体域名，靠这个兜住
    server_name _;

    root /usr/share/nginx/html/student;
    index index.html;

    # 前端单包 1.3MB（gzip 后 434KB），gzip 收益明显
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    client_max_body_size 2m;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # 后端健康检查。后端的 /health 不在 /api/ 前缀下，而下面只反代了 /api/，
    # 所以要单独开一条，否则 /health 会落到 SPA fallback 返回 index.html。
    location = /api-health {
        include /etc/nginx/proxy-common.conf;
        proxy_pass http://backend/health;
        access_log off;
    }

    # ---- SSE：Agent 对话 ----
    # 必须关掉 proxy_buffering，否则 token 全被 nginx 攒着，前端看不到逐字输出。
    # 后端已经发了 X-Accel-Buffering: no（backend/api/routers/agent.py:49），
    # 这里显式再关一遍，两处都在才稳。
    #
    # access_log off 是有意的：SSE 的 JWT 走 query string（EventSource 不能设
    # 自定义头），token 有效期 7 天，不能让它落进访问日志。
    location /api/v1/agent/stream {
        include /etc/nginx/proxy-common.conf;
        proxy_pass http://backend;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        # ReAct 循环要多轮 DeepSeek 往返，可能持续几分钟
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        access_log off;
    }

    # ---- SSE：AI 智能组卷 ----
    # 后端注释说仅规划一步就要十几秒（backend/api/routers/exams.py:240）
    location /api/v1/exams/smart-generate/stream {
        include /etc/nginx/proxy-common.conf;
        proxy_pass http://backend;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        access_log off;
    }

    # ---- 其余 API ----
    location /api/ {
        include /etc/nginx/proxy-common.conf;
        proxy_pass http://backend;
        # 非流式接口也可能慢：同步的智能组卷要等 LLM 规划
        proxy_read_timeout 120s;
    }

    # ---- 听力音频 ----
    # DB 只存相对路径（如 mp3/n1/tiku79/xxx.mp3），前端拼 VITE_AUDIO_BASE_URL。
    # 该变量留空时前端请求落到根相对路径，由这里兜住。
    #
    # 迁到对象存储前的临时方案：把音频挂到宿主机 /srv/audio 由 nginx 直接伺服。
    # 别在这里反代原 HTTP 源站——它同时是爬虫目标站，随时可能断，且没有有效
    # HTTPS 证书，站点上 HTTPS 后会被浏览器 mixed-content 拦掉。
    # 用 root 而不是 alias：location /mp3/ 配 root /srv/audio 会拼成
    # /srv/audio/mp3/xxx.mp3，与 alias 等效，但避免 alias 与 try_files 同用时
    # $uri 解析的已知坑。
    location /mp3/ {
        root /srv/audio;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # 音频还没上传时给明确的 404，而不是打到 SPA 的 index.html
        try_files $uri =404;
    }

    # ---- SPA fallback ----
    # vue-router 用 createWebHistory()（HTML5 模式），刷新 /exam、/result/12
    # 这类深链接时必须回落到 index.html，否则 404。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control $static_cache;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

# ---------------- 后台管理（http://<IP>:8080/）----------------
# 题库读接口现在限定 admin（backend/api/routers/questions.py），但这个界面
# 仍建议只对可信网络开放。要收窄成内网访问，把下面的 allow/deny 打开。
#
# 用 IP 部署时更稳妥的做法：不在 compose 里发布 8080，改用 SSH 隧道访问
#   ssh -L 8080:localhost:8080 user@<IP>
# 详见 deploy/README.md「后台管理的访问方式」。
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html/admin;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    client_max_body_size 2m;

    # 只允许内网访问后台（按需启用，注意别把自己关在外面）
    # allow 10.0.0.0/8;
    # allow 192.168.0.0/16;
    # deny  all;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        include /etc/nginx/proxy-common.conf;
        proxy_pass http://backend;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control $static_cache;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
